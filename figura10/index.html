<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolución BI - Versión Espectacular</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: #0b0f17;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(62, 212, 155, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(62, 212, 155, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.6) 0%, #0b0f17 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    /* Estilo Glassmorphism con traslucidez y brillo suave */
    .card {
      background: rgba(22, 28, 38, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-radius: 22px;
      padding: 24px 35px;
      width: 490px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(62, 212, 155, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      
      /* Animación de Entrada por Defecto */
      opacity: 0;
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Hover interactivo con efecto Neón */
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      background: rgba(28, 36, 48, 0.8);
      border-color: rgba(62, 212, 155, 0.3);
      box-shadow: 
        0 22px 45px rgba(0, 0, 0, 0.6),
        0 0 30px rgba(62, 212, 155, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Títulos en verde menta fluorescente con resplandor */
    .card-title {
      color: #3ed49b;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
      text-shadow: 0 0 12px rgba(62, 212, 155, 0.3);
    }

    .card-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icons-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-mint {
      stroke: #3ed49b;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(62, 212, 155, 0.4));
      transition: transform 0.3s ease;
    }

    .card:hover .icon-mint {
      transform: scale(1.12);
    }

    .card-text {
      font-size: 1.15rem;
      color: #e2e8f0;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* Posicionamiento en escalera con Delays Secuenciales */
    .step-1 {
      align-self: flex-start;
      margin-left: 0;
      animation-delay: 0.2s;
    }

    .step-2 {
      align-self: flex-start;
      margin-left: 200px;
      animation-delay: 0.6s;
    }

    .step-3 {
      align-self: flex-start;
      margin-left: 400px;
      animation-delay: 1.0s;
    }

    .step-3 .card-inner {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .step-3 .card-body-text {
      flex: 1;
    }

    /* Flechas conectoras animadas */
    .arrow-connector {
      position: absolute;
      width: 85px;
      height: 65px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      animation: fadeInArrow 0.8s ease forwards;
    }

    .arrow-1 {
      bottom: -52px;
      left: 110px;
      animation-delay: 0.5s;
    }

    .arrow-2 {
      bottom: -52px;
      left: 110px;
      animation-delay: 0.9s;
    }

    .arrow-path {
      stroke: rgba(62, 212, 155, 0.7);
      stroke-width: 3.5;
      fill: none;
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: drawLine 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: drop-shadow(0 0 8px rgba(62, 212, 155, 0.4));
    }

    .arrow-1 .arrow-path { animation-delay: 0.5s; }
    .arrow-2 .arrow-path { animation-delay: 0.9s; }

    .arrow-head {
      fill: rgba(62, 212, 155, 0.9);
      opacity: 0;
      animation: fadeInHead 0.3s ease forwards;
      filter: drop-shadow(0 0 6px rgba(62, 212, 155, 0.6));
    }

    .arrow-1 .arrow-head { animation-delay: 1.5s; }
    .arrow-2 .arrow-head { animation-delay: 1.9s; }

    /* KEYFRAMES */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeInArrow {
      to { opacity: 1; }
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fadeInHead {
      to { opacity: 1; }
    }

    /* Adaptación móvil */
    @media (max-width: 850px) {
      .step-1, .step-2, .step-3 {
        margin-left: 0;
        align-self: center;
        width: 100%;
        max-width: 480px;
      }

      .arrow-connector {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Bloque 1: BI Tradicional -->
    <div class="card step-1">
      <div class="card-title">BI Tradicional</div>
      <div class="card-content">
        <div class="icons-group">
          <!-- Ícono Gráfica de barras -->
          <svg class="icon-mint" width="28" height="28" viewBox="0 0 24 24">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
            <path d="M3 20h18"></path>
            <path d="M4 11l5-5 4 4 6-6"></path>
          </svg>
          <!-- Ícono Carpeta -->
          <svg class="icon-mint" width="28" height="28" viewBox="0 0 24 24">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div class="card-text">Reportes / dashboards</div>
      </div>

      <!-- Flecha trazada progresivamente -->
      <svg class="arrow-connector arrow-1" viewBox="0 0 100 80">
        <path class="arrow-path" d="M 15 0 Q 15 50 85 50" stroke-linecap="round"/>
        <polygon class="arrow-head" points="80,43 95,50 80,57" />
      </svg>
    </div>

    <!-- Bloque 2: BI Avanzado -->
    <div class="card step-2">
      <div class="card-title">BI Avanzado</div>
      <div class="card-content">
        <div class="icons-group">
          <!-- Ícono Curva / Share -->
          <svg class="icon-mint" width="26" height="26" viewBox="0 0 24 24">
            <polyline points="15 3 21 3 21 9"></polyline>
            <path d="M10 14L21 3"></path>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          </svg>
          <!-- Ícono Tendencia -->
          <svg class="icon-mint" width="26" height="26" viewBox="0 0 24 24">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        </div>
        <div class="card-text">Predicción / automatización</div>
      </div>

      <!-- Flecha trazada progresivamente -->
      <svg class="arrow-connector arrow-2" viewBox="0 0 100 80">
        <path class="arrow-path" d="M 15 0 Q 15 50 85 50" stroke-linecap="round"/>
        <polygon class="arrow-head" points="80,43 95,50 80,57" />
      </svg>
    </div>

    <!-- Bloque 3: BI Inteligente -->
    <div class="card step-3">
      <div class="card-inner">
        <!-- Ícono Cerebro/Bombilla -->
        <svg class="icon-mint" width="46" height="46" viewBox="0 0 24 24">
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"></path>
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"></path>
        </svg>

        <div class="card-body-text">
          <div class="card-title">BI Inteligente</div>
          <div class="card-text">Recomendaciones / decisiones</div>
        </div>

        <!-- Ícono Balanza -->
        <svg class="icon-mint" width="40" height="40" viewBox="0 0 24 24">
          <line x1="12" y1="3" x2="12" y2="21"></line>
          <path d="M5 12l7-4 7 4"></path>
          <path d="M3 21h18"></path>
          <path d="M5 12l-2 6h4l-2-6z"></path>
          <path d="M19 12l-2 6h4l-2-6z"></path>
        </svg>
      </div>
    </div>

  </div>

</body>
</html>
