<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafíos y Descripciones - Efecto Látigo</title>
    <!-- Importación de la fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4D3FA1; /* Morado corporativo de la imagen */
            --bg-light: #F0EDFD;       /* Lila claro para filas alternadas */
            --bg-white: #ffffff;
            --text-color: #2c3e50;
            --border-color: #E2DCF7;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f6fc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .table-container {
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 12px 40px rgba(77, 63, 161, 0.12);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-white);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            padding: 16px 20px;
            font-size: 14px;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            line-height: 1.5;
            vertical-align: middle;
        }

        /* --- CONTROL DE PROPORCIONES Y ALINEACIONES --- */
        th:nth-child(1), td:nth-child(1) { width: 35%; text-align: left; padding-left: 24px; }
        th:nth-child(2), td:nth-child(2) { width: 65%; text-align: left; padding-left: 24px; }

        /* Estilo para la primera columna del cuerpo */
        tbody td:nth-child(1) {
            font-weight: 500;
            color: #111111;
        }

        /* --- ENCABEZADOS MORADOS CON EFECTO LÁTIGO VERTICAL --- */
        thead th {
            background-color: var(--primary-color);
            color: var(--bg-white) !important;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            padding: 18px 20px;
            /* Latigazo vertical en el header */
            animation: whipHeader 0.85s cubic-bezier(0.68, -0.6, 0.32, 1.6) both;
        }

        /* Alternancia de color en las filas (Zebra Striping) */
        tbody tr:nth-child(even) td {
            background-color: var(--bg-light);
        }
        tbody tr:nth-child(odd) td {
            background-color: var(--bg-white);
        }

        /* --- KEYFRAMES EFECTO LÁTIGO (WHIP EFFECT) --- */
        
        /* 1. Látigo descendente para la cabecera */
        @keyframes whipHeader {
            0% {
                opacity: 0;
                transform: translateY(-80px) scaleY(1.4) skewY(-3deg);
            }
            60% {
                opacity: 1;
                transform: translateY(18px) scaleY(0.85) skewY(2deg);
            }
            80% {
                transform: translateY(-6px) scaleY(1.05) skewY(-0.5deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scaleY(1) skewY(0deg);
            }
        }

        /* 2. Látigo horizontal elástico para cada fila */
        @keyframes whipRow {
            0% {
                opacity: 0;
                transform: translateX(-120px) scaleX(1.15) skewX(12deg);
            }
            60% {
                opacity: 1;
                transform: translateX(20px) scaleX(0.92) skewX(-4deg);
            }
            80% {
                transform: translateX(-8px) scaleX(1.03) skewX(1.5deg);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scaleX(1) skewX(0deg);
            }
        }

        tbody tr {
            opacity: 0;
            animation: whipRow 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        /* Retrasos secuenciales marcados para simular el chasquido del látigo */
        tbody tr:nth-child(1) { animation-delay: 0.15s; }
        tbody tr:nth-child(2) { animation-delay: 0.28s; }
        tbody tr:nth-child(3) { animation-delay: 0.41s; }

        /* Efecto Hover interactivo */
        tbody tr:hover td {
            background-color: rgba(77, 63, 161, 0.08) !important;
            transition: background-color 0.15s ease;
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DESAFÍO</th>
                    <th>DESCRIPCIÓN</th>
                </tr>
            </thead>
            <tbody>
                <!-- Fila 1: Integración -->
                <tr>
                    <td>Integración</td>
                    <td>Datos en múltiples formatos</td>
                </tr>
                <!-- Fila 2: Escalabilidad -->
                <tr>
                    <td>Escalabilidad</td>
                    <td>Grandes volúmenes de datos</td>
                </tr>
                <!-- Fila 3: Tiempo real -->
                <tr>
                    <td>Tiempo real</td>
                    <td>Necesidad de procesamiento inmediato</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
