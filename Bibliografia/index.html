<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Data, Computación en la Nube e IA - Bibliografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-base: #483C9A; 
            --accent-bright: #b3a6ff; 
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(72, 60, 154, 0.4);
            --text-main: #ffffff;
            --text-dim: #dfdbf7;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #05040f;
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; cursor: default;
        }

        .fluid-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #070617; filter: blur(80px);
        }
        .fluid-layer { position: absolute; border-radius: 50%; opacity: 0.35; animation: fluidMove infinite alternate ease-in-out; }
        .layer-1 { background: radial-gradient(circle, var(--accent-base) 0%, transparent 70%); width: 100vw; height: 100vw; top: -30%; left: -10%; animation-duration: 20s; }
        .layer-2 { background: radial-gradient(circle, #1a1540 0%, transparent 70%); width: 80vw; height: 80vw; bottom: -20%; right: -10%; animation-duration: 25s; }
        @keyframes fluidMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10%, 5%) scale(1.1); } }

        .nav-instruction {
            width: 90vw; max-width: 1400px;
            background: rgba(72, 60, 154, 0.15);
            border: 1px dashed var(--accent-bright);
            padding: 15px; border-radius: 12px;
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem; color: var(--accent-bright);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .main-header { text-align: center; padding: 30px 20px; z-index: 1; }
        .main-header h1 { font-weight: 300; font-size: 2rem; letter-spacing: 4px; text-transform: uppercase; margin: 0; background: linear-gradient(to right, #fff, var(--text-dim)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-header .line { width: 60px; height: 3px; background: var(--accent-bright); margin: 15px auto; }

        .reference-grid {
            display: grid; width: 90vw; max-width: 1400px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px; padding-bottom: 80px; z-index: 1;
        }

        .card {
            font-family: 'Poppins', sans-serif;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 25px;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
            min-height: 160px;
        }
        .card:hover { border-color: var(--accent-bright); transform: translateY(-5px); background: rgba(72, 60, 154, 0.12); box-shadow: 0 10px 20px rgba(72, 60, 154, 0.25); }

        .author-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-bright); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .title { font-size: 0.9rem; font-weight: 400; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }

        .footer-info {
            font-size: 0.75rem; font-weight: 300; color: var(--text-dim);
            border-top: 1px solid rgba(72, 60, 154, 0.3);
            padding-top: 15px; margin-top: auto; word-break: break-word;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-visit { font-family: 'Poppins', sans-serif; text-decoration: none; background: var(--accent-bright); color: #05040f; padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; transition: background 0.2s; text-align: center; display: inline-block; }
        .btn-visit:hover { background: #ffffff; }
    </style>
</head>
<body>

    <div class="fluid-background">
        <div class="fluid-layer layer-1"></div>
        <div class="fluid-layer layer-2"></div>
    </div>

    <div class="nav-instruction">
        ⚡ <b>Instrucción de Navegación:</b> Consulta las referencias fundamentales sobre Big Data, procesamiento distribuido, arquitecturas Cloud, Inteligencia Artificial y Ética de Datos.
    </div>

    <header class="main-header">
        <h1>Big Data, Cloud Computing e Inteligencia Artificial</h1>
        <div class="line"></div>
    </header>

    <main class="reference-grid" id="grid"></main>

    <script>
        const sources = [
            { a: "Akidau, T., Chernyak, S., & Lax, R. (2015)", t: "Streaming Systems", f: "O’Reilly Media" },
            { a: "Armbrust, M. et al. (2010)", t: "A view of cloud computing", f: "Communications of the ACM" },
            { a: "AWS (2023)", t: "AWS Analytics Services Overview", f: "Amazon Web Services", u: "https://aws.amazon.com" },
            { a: "Chen, H., Chiang, R., & Storey, V. (2012)", t: "Business Intelligence and Analytics: From Big Data to Big Impact", f: "MIS Quarterly" },
            { a: "Davenport, T., & Ronanki, R. (2018)", t: "Artificial Intelligence for the Real World", f: "Harvard Business Review" },
            { a: "Erl, T., Puttini, R., & Mahmood, Z. (2013)", t: "Cloud Computing: Concepts, Technology & Architecture", f: "Prentice Hall" },
            { a: "European Commission (2020)", t: "Ethics Guidelines for Trustworthy AI", f: "European Union" },
            { a: "Floridi, L. et al. (2018)", t: "AI4People—An Ethical Framework for a Good AI Society", f: "Minds and Machines" },
            { a: "Gandomi, A., & Haider, M. (2015)", t: "Beyond the hype: Big data concepts, methods, and analytics", f: "International Journal of Information Management" },
            { a: "Gartner (2020)", t: "Augmented Analytics is the Future of Data and Analytics", f: "Gartner" },
            { a: "Google Cloud (2023)", t: "BigQuery and Analytics Overview", f: "Google Cloud", u: "https://cloud.google.com" },
            { a: "Hashem, I. et al. (2015)", t: "The rise of “Big Data” on cloud computing", f: "Information Systems" },
            { a: "Jobin, A., Ienca, M., & Vayena, E. (2019)", t: "The global landscape of AI ethics guidelines", f: "Nature Machine Intelligence" },
            { a: "Jordan, M., & Mitchell, T. (2015)", t: "Machine Learning: Trends, Perspectives, and Prospects", f: "Science" },
            { a: "Kreps, J. (2014)", t: "Questioning the Lambda Architecture", f: "O’Reilly" },
            { a: "Marston, S. et al. (2011)", t: "Cloud computing—The business perspective", f: "Decision Support Systems" },
            { a: "McAfee, A., & Brynjolfsson, E. (2012)", t: "Big Data: The Management Revolution", f: "Harvard Business Review" },
            { a: "Microsoft (2023)", t: "Azure Data Platform Documentation", f: "Microsoft", u: "https://learn.microsoft.com" },
            { a: "Provost, F., & Fawcett, T. (2013)", t: "Data Science for Business", f: "O’Reilly Media" },
            { a: "Russell, S., & Norvig, P. (2021)", t: "Artificial Intelligence: A Modern Approach", f: "Pearson" },
            { a: "Sharda, R., Delen, D., & Turban, E. (2018)", t: "Business Intelligence, Analytics, and Data Science: A Managerial Perspective", f: "Pearson" },
            { a: "Sivarajah, U. et al. (2017)", t: "Critical analysis of Big Data challenges and analytical methods", f: "Journal of Business Research" },
            { a: "Wamba, S. et al. (2020)", t: "Big data analytics and firm performance", f: "Journal of Business Research" },
            { a: "White, T. (2015)", t: "Hadoop: The Definitive Guide", f: "O’Reilly Media" },
            { a: "Zaharia, M. et al. (2016)", t: "Apache Spark: A Unified Engine for Big Data Processing", f: "Communications of the ACM" }
        ];

        const grid = document.getElementById('grid');

        sources.forEach((s) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let html = `
                <div class="author-tag">${s.a}</div>
                <div class="title">${s.t}</div>
                <div class="footer-info">${s.f}</div>
            `;

            if(s.u) {
                html += `
                    <div class="btn-group">
                        <a href="${s.u}" target="_blank" class="btn-visit">Visitar Enlace</a>
                    </div>
                `;
            }

            card.innerHTML = html;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
