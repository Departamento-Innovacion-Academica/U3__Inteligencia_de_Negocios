<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de Trabajo 3D Whip - Orden Correcto</title>
  <!-- Iconos de Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f1115;
      padding: 20px;
      perspective: 1000px;
      overflow-x: hidden;
    }

    /* Contenedor principal */
    .flow-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #b0b3b8;
      padding: 25px;
      border-radius: 28px;
      gap: 12px;
      max-width: 1000px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    /* Estilo base de las tarjetas */
    .step-card {
      background-color: #2b2e34;
      color: #ffffff;
      border-radius: 20px;
      flex: 1;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      backface-visibility: hidden;
      will-change: transform, opacity;
      
      /* Animación base */
      animation: whipIn3D 0.8s cubic-bezier(0.25, 1, 0.5, 1) both;
    }

    /* Estilo base de las flechas */
    .arrow {
      color: #2b2e34;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      backface-visibility: hidden;
      will-change: transform, opacity;
      
      /* Animación base */
      animation: whipIn3D 0.6s cubic-bezier(0.25, 1, 0.5, 1) both;
    }

    /* --- SECUENCIA SECUENCIAL EXACTA POR POSICIÓN DE HIJO (1 a 7) --- */
    .flow-container > *:nth-child(1) { animation-delay: 0.1s; } /* Tarjeta 1: Datos */
    .flow-container > *:nth-child(2) { animation-delay: 0.3s; } /* Flecha 1 */
    .flow-container > *:nth-child(3) { animation-delay: 0.5s; } /* Tarjeta 2: Modelo */
    .flow-container > *:nth-child(4) { animation-delay: 0.7s; } /* Flecha 2 */
    .flow-container > *:nth-child(5) { animation-delay: 0.9s; } /* Tarjeta 3: Predicción */
    .flow-container > *:nth-child(6) { animation-delay: 1.1s; } /* Flecha 3 */
    .flow-container > *:nth-child(7) { animation-delay: 1.3s; } /* Tarjeta 4: Decisión */

    /* Keyframe Látigo 3D */
    @keyframes whipIn3D {
      0% {
        opacity: 0;
        transform: translate3d(-150px, -80px, 300px) rotateY(-60deg) rotateZ(-20deg) scale(0.6);
      }
      65% {
        opacity: 1;
        transform: translate3d(10px, 5px, 0) rotateY(12deg) rotateZ(3deg) scale(1.05);
      }
      85% {
        transform: translate3d(-3px, -1px, 0) rotateY(-4deg) rotateZ(-1deg) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotateY(0deg) rotateZ(0deg) scale(1);
      }
    }

    /* Iconos y textos */
    .step-card i {
      font-size: 3rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .step-card span {
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    /* Adaptabilidad a móviles */
    @media (max-width: 768px) {
      .flow-container {
        flex-direction: column;
      }

      .step-card {
        width: 100%;
        height: 140px;
      }

      .arrow {
        transform: rotate(90deg);
        margin: 5px 0;
      }
    }
  </style>
</head>
<body>

  <div class="flow-container">
    
    <!-- Hijo 1 -->
    <div class="step-card">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>Datos<br>históricos</span>
    </div>

    <!-- Hijo 2 -->
    <div class="arrow">
      <i class="fa-solid fa-caret-right"></i>
    </div>

    <!-- Hijo 3 -->
    <div class="step-card">
      <i class="fa-solid fa-brain"></i>
      <span>Modelo</span>
    </div>

    <!-- Hijo 4 -->
    <div class="arrow">
      <i class="fa-solid fa-caret-right"></i>
    </div>

    <!-- Hijo 5 -->
    <div class="step-card">
      <i class="fa-solid fa-chart-line"></i>
      <span>Predicción</span>
    </div>

    <!-- Hijo 6 -->
    <div class="arrow">
      <i class="fa-solid fa-caret-right"></i>
    </div>

    <!-- Hijo 7 -->
    <div class="step-card">
      <i class="fa-solid fa-user-check"></i>
      <span>Decisión</span>
    </div>

  </div>

</body>
</html>
